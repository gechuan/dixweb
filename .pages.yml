# Pages CMS configuration: https://pagescms.org
# Point Pages CMS at this repo and it will expose these collections for
# editing in the browser or on mobile.

media:
  - name: assets
    input: public/assets
    output: /assets

content:
  - name: site
    label: 站点设置
    path: src/data/site.json
    type: file
    format: json
    fields:
      - { name: siteUrl, label: 站点 URL, type: string }
      - { name: title, label: 站点标题, type: string }
      - { name: description, label: 站点描述, type: text }
      - { name: author, label: 作者, type: string }
      - { name: brand, label: 站点名称, type: string }
      - { name: avatar, label: 头像, type: image }
      - { name: role, label: 身份说明, type: string }
      - { name: tagline, label: 标语, type: string }
      - name: nav
        label: 导航
        type: object
        list: true
        fields:
          - { name: label, label: 名称, type: string }
          - { name: href, label: 链接, type: string }
          - { name: match, label: 高亮标记, type: string }
      - name: social
        label: 社交与外部链接
        type: object
        fields:
          - { name: x, label: X 链接, type: string }
          - { name: xLabel, label: X 文案, type: string }
          - { name: github, label: GitHub 链接, type: string }
          - { name: blog, label: 博客链接, type: string }
          - { name: blogLabel, label: 博客文案, type: string }
          - { name: airss, label: AI 资讯链接, type: string }
          - { name: airssLabel, label: AI 资讯文案, type: string }
          - { name: rss, label: RSS 路径, type: string }
          - { name: nexttoken, label: 播客链接, type: string }
          - { name: nexttokenLabel, label: 播客文案, type: string }
      - name: stats
        label: 首页数据
        type: object
        fields:
          - { name: projects, label: 项目数, type: string }
          - { name: podcastEpisodes, label: 播客期数, type: string }
          - { name: githubStars, label: Star 数, type: string }
      - name: dateline
        label: 顶部日期栏
        type: object
        fields:
          - { name: episodeLabel, label: 文案, type: string }
          - { name: episodeUrl, label: 链接, type: string }
      - name: umami
        label: Umami 统计
        type: object
        fields:
          - { name: src, label: script.js 地址, type: string, description: 例如 https://umami.example.com/script.js，留空则不加载 }
          - { name: websiteId, label: 网站 ID, type: string }
          - { name: note, label: 备注, type: text }
      - name: footer
        label: 页脚
        type: object
        fields:
          - { name: colo, label: 宣言文案, type: string }
          - { name: coloUrl, label: 宣言链接, type: string }
          - { name: copyright, label: 版权文案, type: string }
          - { name: repos, label: 开源仓库链接, type: string }

  - name: home
    label: 首页
    path: src/data/home.json
    type: file
    format: json
    fields:
      - name: hero
        label: 首屏
        type: object
        fields:
          - name: titleLines
            label: 大标题（支持 <span class="r"> 高亮）
            type: string
            list: true
          - { name: lede, label: 自我介绍（支持 <b> 加粗）, type: text }
          - name: primaryCta
            label: 主按钮
            type: object
            fields:
              - { name: label, label: 文案, type: string }
              - { name: href, label: 链接, type: string }
          - name: secondaryCta
            label: 次按钮
            type: object
            fields:
              - { name: label, label: 文案, type: string }
              - { name: href, label: 链接, type: string }
          - name: proof
            label: 数据栏
            type: object
            list: true
            fields:
              - { name: value, label: 数值, type: string }
              - { name: label, label: 说明, type: string }
              - { name: href, label: 链接, type: string }
      - name: cols
        label: 本期目录三栏
        type: object
        list: true
        fields:
          - { name: title, label: 栏目名, type: string }
          - name: more
            label: 更多链接
            type: object
            fields:
              - { name: label, label: 文案, type: string }
              - { name: href, label: 链接, type: string }
          - name: entries
            label: 条目
            type: object
            list: true
            fields:
              - { name: date, label: 日期, type: string }
              - { name: tag, label: 标签, type: string }
              - { name: title, label: 标题, type: string }
              - { name: url, label: 链接, type: string }
      - name: podcast
        label: 播客区块
        type: object
        fields:
          - { name: kicker, label: 眉题, type: string }
          - { name: titleLines, label: 标题（按行拆分）, type: string, list: true }
          - name: more
            label: 更多链接
            type: object
            fields:
              - { name: label, label: 文案, type: string }
              - { name: href, label: 链接, type: string }
          - name: latest
            label: 最新一期
            type: object
            fields:
              - { name: no, label: 期号, type: string }
              - { name: show, label: 节目名, type: string }
              - { name: date, label: 日期, type: string }
              - { name: title, label: 标题, type: string }
              - { name: summary, label: 摘要, type: text }
              - { name: hosts, label: 主理人, type: string, list: true }
              - name: listen
                label: 收听链接
                type: object
                list: true
                fields:
                  - { name: label, label: 平台, type: string }
                  - { name: href, label: 链接, type: string }
          - name: eps
            label: 往期列表
            type: object
            list: true
            fields:
              - { name: no, label: 期号, type: string }
              - { name: title, label: 标题, type: string }
              - { name: meta, label: 说明, type: string }
              - { name: href, label: 链接, type: string }
      - name: about
        label: 关于区块
        type: object
        fields:
          - { name: kicker, label: 眉题, type: string }
          - { name: titleLines, label: 标题（按行拆分）, type: string, list: true }
          - { name: paragraphs, label: 段落（支持 <em>）, type: text, list: true }
          - name: facts
            label: 数据
            type: object
            list: true
            fields:
              - { name: value, label: 数值, type: string }
              - { name: label, label: 说明, type: string }
      - name: projects
        label: 项目区块
        type: object
        fields:
          - { name: kicker, label: 眉题, type: string }
          - { name: titleLines, label: 标题（按行拆分）, type: string, list: true }
          - name: more
            label: 更多链接
            type: object
            fields:
              - { name: label, label: 文案, type: string }
              - { name: href, label: 链接, type: string }
      - name: now
        label: 今天做了啥
        type: object
        fields:
          - { name: title, label: 标题, type: string }
          - { name: date, label: 日期, type: string }
          - { name: body, label: 内容, type: text }
          - name: more
            label: 更多链接
            type: object
            fields:
              - { name: label, label: 文案, type: string }
              - { name: href, label: 链接, type: string }
  - name: notes
    label: 随想
    path: src/data/notes.json
    type: file
    format: json
    fields:
      - { name: lede, label: 页面说明, type: text }
      - name: entries
        label: 随想列表
        type: object
        list: true
        fields:
          - { name: id, label: ID（唯一，如 n-20261105a）, type: string }
          - { name: author, label: 作者, type: string }
          - { name: datetime, label: 时间（ISO 格式）, type: string }
          - { name: datelabel, label: 显示时间, type: string }
          - { name: html, label: 内容（HTML）, type: text }

  - name: podcast
    label: 播客
    path: src/data/podcast.json
    type: file
    format: json
    fields:
      - name: nextToken
        label: Next Token 节目信息
        type: object
        fields:
          - { name: eyebrow, label: 眉题, type: string }
          - { name: name, label: 节目名, type: string }
          - { name: description, label: 介绍, type: text }
          - name: platforms
            label: 收听平台
            type: object
            list: true
            fields:
              - { name: label, label: 平台, type: string }
              - { name: url, label: 链接, type: string }
          - name: moreLinks
            label: 更多链接
            type: object
            list: true
            fields:
              - { name: label, label: 文案, type: string }
              - { name: url, label: 链接, type: string }
      - name: digests
        label: 中文精读站
        type: object
        fields:
          - { name: kicker, label: 眉题, type: string }
          - { name: title, label: 标题, type: string }
          - name: groups
            label: 分组
            type: object
            list: true
            fields:
              - { name: label, label: 分组名, type: string }
              - name: items
                label: 站点
                type: object
                list: true
                fields:
                  - { name: url, label: 链接, type: string }
                  - { name: name, label: 名称, type: string }
                  - { name: badge, label: 徽标, type: string }
                  - { name: description, label: 描述, type: text }
                  - { name: domain, label: 域名, type: string }
      - name: episodes
        label: Next Token 单集
        type: object
        list: true
        fields:
          - { name: show, label: 所属节目 ID, type: string }
          - { name: date, label: 日期, type: string }
          - { name: meta, label: 期数, type: string }
          - { name: title, label: 标题, type: string }
          - { name: summary, label: 摘要, type: text }
          - { name: url, label: 链接, type: string }

  - name: projects
    label: 项目
    path: src/data/projects.json
    type: file
    format: json
    fields:
      - name: featured
        label: 首页精选
        type: object
        list: true
        fields:
          - { name: name, label: 名称, type: string }
          - { name: tag, label: 分类标签, type: string }
          - { name: badge, label: 徽标, type: string }
          - { name: description, label: 描述, type: text }
          - { name: url, label: 链接, type: string }
          - { name: stat, label: 数据展示, type: string }
      - name: groups
        label: 项目分组
        type: object
        list: true
        fields:
          - { name: id, label: 分组 ID, type: string }
          - { name: title, label: 分组名, type: string }
          - { name: note, label: 分组说明, type: text }
          - { name: downloads, label: 累计下载, type: string }
          - name: items
            label: 项目
            type: object
            list: true
            fields:
              - { name: name, label: 名称, type: string }
              - { name: category, label: 类别 ID, type: string }
              - { name: badge, label: 徽标, type: string }
              - { name: description, label: 描述, type: text }
              - { name: url, label: 链接, type: string }
              - { name: stat, label: 数据展示, type: string }

  - name: about
    label: 关于
    path: src/data/about.json
    type: file
    format: json
    fields:
      - { name: eyebrow, label: 眉题, type: string }
      - { name: title, label: 标题, type: string }
      - { name: updated, label: 更新时间, type: string }
      - { name: lede, label: 开头介绍（支持 <em>）, type: text }
      - name: paragraphs
        label: 段落（支持 <em>）
        type: text
        list: true
      - name: doing
        label: 我在做什么
        type: object
        list: true
        fields:
          - { name: label, label: 主题, type: string }
          - { name: text, label: 内容, type: text }
      - { name: tags, label: 关注方向标签, type: string, list: true }
      - name: facts
        label: 数据
        type: object
        list: true
        fields:
          - { name: value, label: 数值, type: string }
          - { name: label, label: 说明, type: string }

  - name: now
    label: 现在
    path: src/data/now.json
    type: file
    format: json
    fields:
      - { name: eyebrow, label: 眉题, type: string }
      - { name: title, label: 标题, type: string }
      - { name: updated, label: 更新时间, type: string }
      - { name: lede, label: 说明, type: text }
      - name: today
        label: 今天做了啥
        type: object
        fields:
          - { name: title, label: 标题, type: string }
          - { name: date, label: 日期, type: string }
          - { name: subtitle, label: 小标题, type: string }
          - { name: paragraphs, label: 段落, type: text, list: true }
          - name: links
            label: 链接
            type: object
            list: true
            fields:
              - { name: label, label: 文案, type: string }
              - { name: href, label: 链接, type: string }
      - name: items
        label: 正在做的事
        type: object
        list: true
        fields:
          - { name: title, label: 标题, type: string }
          - { name: text, label: 内容, type: text }
          - { name: href, label: 链接, type: string }
          - { name: linkLabel, label: 链接文案, type: string }
