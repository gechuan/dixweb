# Pages CMS configuration: https://pagescms.org
media:
  - name: assets
    input: public/assets
    output: /assets

content:
  - name: site
    label: 站点设置
    path: src/data/site.json
    type: file
    format: json
    fields:
      - { name: siteUrl, label: 站点 URL, type: string }
      - { name: title, label: 站点标题, type: string }
      - { name: description, label: 站点描述, type: text }
      - { name: author, label: 作者, type: string }
      - { name: brand, label: 站点名称, type: string }
      - { name: logo, label: 站点 Logo, type: image }
      - { name: tagline, label: 标语, type: string }
      - name: nav
        label: 导航
        type: object
        list: true
        fields:
          - { name: label, label: 名称, type: string }
          - { name: href, label: 链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
      - name: social
        label: 社交与外部链接
        type: object
        fields:
          - { name: x, label: X 链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
          - { name: xLabel, label: X 文案, type: string }
          - { name: github, label: GitHub 链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
          - { name: blog, label: 博客链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
          - { name: blogLabel, label: 博客文案, type: string }
          - { name: blogRss, label: 博客 RSS, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
          - { name: podcast, label: 播客链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
          - { name: podcastLabel, label: 播客文案, type: string }
          - { name: wechat, label: 公众号名称, type: string }
      - name: features
        label: 功能开关
        type: object
        fields:
          - { name: projects, label: 显示项目区块, type: boolean }
          - { name: now, label: 显示最近在做, type: boolean }
          - { name: reward, label: 显示打赏, type: boolean }
      - name: umami
        label: Umami 统计
        type: object
        fields:
          - { name: src, label: script.js 地址, type: string, description: 留空则不加载统计脚本。 }
          - { name: websiteId, label: 网站 ID, type: string }
      - name: footer
        label: 页脚
        type: object
        fields:
          - { name: colo, label: 宣言文案, type: string }
          - { name: coloUrl, label: 宣言链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
          - { name: copyright, label: 版权文案, type: string }

  - name: home
    label: 首页
    path: src/data/home.json
    type: file
    format: json
    fields:
      - name: hero
        label: 首屏
        type: object
        fields:
          - name: titleLines
            label: 大标题
            type: string
            list: true
            description: 支持 <span class="r"> 高亮。
          - { name: lede, label: 自我介绍（支持 <em>）, type: text }
          - name: primaryCta
            label: 主按钮
            type: object
            fields:
              - { name: label, label: 文案, type: string }
              - { name: href, label: 链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
          - name: secondaryCta
            label: 次按钮
            type: object
            fields:
              - { name: label, label: 文案, type: string }
              - { name: href, label: 链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
          - name: proofLabels
            label: 首屏数据说明
            type: object
            fields:
              - { name: podcast, label: 播客说明, type: string }
              - { name: rss, label: 资讯说明, type: string }
              - { name: trends, label: 探索说明, type: string }
      - name: contents
        label: 本期目录
        type: object
        fields:
          - { name: title, label: 标题, type: string }
          - { name: perColumn, label: 每栏条数, type: number }
      - name: blog
        label: 博客精选
        type: object
        fields:
          - name: entries
            label: 博客文章
            type: object
            list: true
            fields:
              - { name: date, label: 日期, type: string }
              - { name: tag, label: 标签, type: string }
              - { name: title, label: 标题, type: string }
              - { name: url, label: 链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
      - name: podcast
        label: 播客区块
        type: object
        fields:
          - { name: kicker, label: 眉题, type: string }
          - name: titleLines
            label: 标题
            type: string
            list: true
          - { name: recentCount, label: 往期数量, type: number }
      - name: projects
        label: 项目区块
        type: object
        fields:
          - { name: kicker, label: 眉题, type: string }
          - name: titleLines
            label: 标题
            type: string
            list: true
      - name: about
        label: 关于区块
        type: object
        fields:
          - { name: kicker, label: 眉题, type: string }
          - name: titleLines
            label: 标题
            type: string
            list: true
          - name: paragraphs
            label: 段落
            type: text
            list: true
      - name: now
        label: 最近在做
        type: object
        fields:
          - { name: title, label: 标题, type: string }
          - { name: date, label: 日期, type: string }
          - { name: body, label: 内容, type: text }
          - name: more
            label: 更多链接
            type: object
            fields:
              - { name: label, label: 文案, type: string }
              - { name: href, label: 链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }

  - name: podcast
    label: 播客
    path: src/data/podcast.json
    type: file
    format: json
    fields:
      - name: show
        label: 节目信息
        type: object
        fields:
          - { name: id, label: 标识, type: string }
          - { name: name, label: 节目名, type: string }
          - { name: eyebrow, label: 眉题, type: string }
          - { name: description, label: 节目简介, type: text }
          - { name: cover, label: 节目封面, type: image }
          - name: hosts
            label: 主理人
            type: string
            list: true
          - name: platforms
            label: 收听平台
            type: object
            list: true
            fields:
              - { name: label, label: 平台名, type: string }
              - { name: url, label: 链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
      - name: episodes
        label: 单集
        type: object
        list: true
        fields:
          - { name: date, label: 日期, type: date }
          - { name: title, label: 标题, type: string }
          - { name: summary, label: 摘要, type: text }
          - { name: url, label: 链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }

  - name: projects
    label: 项目
    path: src/data/projects.json
    type: file
    format: json
    description: 只填写自己创建或维护的项目。
    fields:
      - name: items
        label: 项目列表
        type: object
        list: true
        fields:
          - { name: name, label: 名称, type: string }
          - { name: description, label: 一句话描述, type: text }
          - { name: url, label: 链接, type: string, description: 只填你自己的内容，构建会拦截黑名单域名。 }
          - { name: image, label: 截图, type: image, required: false }
          - { name: badge, label: 状态标签, type: string, required: false }

  - name: about
    label: 关于
    path: src/data/about.json
    type: file
    format: json
    fields:
      - { name: eyebrow, label: 眉题, type: string }
      - { name: title, label: 标题, type: string }
      - { name: lede, label: 导语（支持 <em>）, type: text }
      - name: paragraphs
        label: 正文段落
        type: text
        list: true
      - name: doing
        label: 我在做什么
        type: object
        list: true
        fields:
          - { name: label, label: 名称, type: string }
          - { name: text, label: 内容（支持链接）, type: text }
      - name: tags
        label: 关注方向
        type: string
        list: true
      - name: links
        label: 联系链接
        type: object
        list: true
        fields:
          - { name: label, label: 名称, type: string }
          - { name: action, label: 动作, type: string, required: false, description: 填 follow 表示打开公众号弹窗。 }
          - { name: href, label: 链接, type: string, required: false, description: 只填你自己的内容，构建会拦截黑名单域名。 }
